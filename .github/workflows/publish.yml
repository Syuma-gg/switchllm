# PyPI への公開。Trusted Publishing（OIDC）を使うので、API トークンの secret は要らない。
#
# - 手動で実行（Actions タブの「Run workflow」）→ TestPyPI に上げる。公開前の確認用
# - GitHub の Release を公開する（タグは v<版>、例: v0.1.0）→ PyPI に上げる
#
# どちらも、ビルドした配布物を検査してから上げる（docs/exec-plans/active/v0.1-release.md の手順を自動にしたもの）。
# PyPI 側と GitHub 側で要る設定は、同じ計画の「公開の設定」にある。
# 構成は PyPA のガイドに倣った:
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # build と twine はプロジェクトの依存に入れない（v0.1-release.md の判断）
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: check that the release tag matches the version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          if [ ! -f "dist/switchllm-${version}.tar.gz" ]; then
            echo "::error::release tag ${TAG} does not match the built version. Built: $(ls dist)"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  test-dist:
    # 展開した sdist の中で、sdist の src/ と、インストールした wheel の両方で全テストを回す
    name: test the built distributions
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - run: python -m pip install dist/*.whl pytest
      - run: mkdir sdist && tar -xzf dist/*.tar.gz -C sdist --strip-components=1
      - name: pytest with the sdist's src/
        working-directory: sdist
        run: python -m pytest
      - name: pytest with the installed wheel
        working-directory: sdist
        # pythonpath から src を外し、site-packages の switchllm を import させる（scripts/ と e2e/ はテストが使う）
        run: |
          python -c "import switchllm; assert 'site-packages' in switchllm.__file__, switchllm.__file__"
          python -m pytest -o "pythonpath=scripts e2e"

  publish-testpypi:
    name: publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: [build, test-dist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/switchllm
    permissions:
      id-token: write  # Trusted Publishing に必須
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: publish to PyPI
    if: github.event_name == 'release'
    needs: [build, test-dist]
    runs-on: ubuntu-latest
    environment:
      name: pypi  # GitHub の設定で、この environment に承認者を付ける（PyPA のガイドが必須としている）
      url: https://pypi.org/p/switchllm
    permissions:
      id-token: write  # Trusted Publishing に必須
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
