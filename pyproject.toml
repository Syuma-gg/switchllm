[build-system]
requires = ["setuptools>=77"]  # license = "MIT"（SPDX 式）の書き方に必要
build-backend = "setuptools.build_meta"

[project]
name = "switchllm"
version = "0.1.0"
description = "One client for OpenAI, Anthropic, Gemini and OpenAI-compatible LLM APIs. Change one string to switch providers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
