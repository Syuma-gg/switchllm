[build-system]
requires = ["setuptools>=77"]  # license = "MIT"（SPDX 式）の書き方に必要
build-backend = "setuptools.build_meta"

[project]
name = "switchllm"
dynamic = ["version"]  # 版の正本は src/switchllm/__init__.py の __version__
description = "One client for OpenAI, Anthropic, Gemini and OpenAI-compatible LLM APIs. Change one string to switch providers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Syuma-gg" }]
keywords = ["llm", "openai", "anthropic", "claude", "gemini", "ollama", "tool-calling", "streaming"]
# Python の版は .github/workflows/test.yml の matrix と合わせる。license を SPDX 式で書いたので License :: は付けない
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Syuma-gg/switchllm"
Repository = "https://github.com/Syuma-gg/switchllm"
Issues = "https://github.com/Syuma-gg/switchllm/issues"
Changelog = "https://github.com/Syuma-gg/switchllm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.17",
    "coverage[toml]>=7.6",  # [toml] は Python 3.10 で下の [tool.coverage] を読むのに要る
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "switchllm.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]  # scripts/ は tests/test_quality_gate.py が読む
testpaths = ["tests"]  # e2e/ は実 API を呼ぶ（料金が発生する）ので入れない。回し方は docs/e2e-tests.md

# ---- 品質検査の基準 ----
# scripts/quality_gate.py（Claude Code の Stop フックと CI）がこの値で検査する。
# 基準を緩めるのはユーザーの了承を得てから（docs/quality-gates.md）。
[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.coverage.run]
branch = true
source_pkgs = ["switchllm"]

[tool.coverage.report]
fail_under = 98  # 実測値（2026-11-15 に 98.55%）の小数を切り捨てた値。上がったら引き上げる。下げない
show_missing = true
skip_covered = true
