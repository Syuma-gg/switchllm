# Claude Code の Stop フックと同じ品質検査（docs/quality-gates.md）を、push と pull request のたびに回す。
# フックの外で入った変更や、フックを外した環境での変更を止める最後の砦。
name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality gate (ruff, pytest, coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"  # 手元の仮想環境と同じ版にすると、カバレッジの数字がそろう
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/quality_gate.py --ci
