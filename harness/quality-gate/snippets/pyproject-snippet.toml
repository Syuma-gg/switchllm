# 品質検査（scripts/quality_gate.py）のための設定。プロジェクトの pyproject.toml に足す。
# すでに同じ節があるなら、値を足し合わせる。基準を緩めるのはユーザーの了承を得てから（docs/quality-gates.md）。

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.17",
    "coverage[toml]>=7.6",  # [toml] は Python 3.10 で pyproject.toml の [tool.coverage] を読むのに要る
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]  # tests/test_quality_gate.py が scripts/quality_gate.py を読む。src レイアウトなら "src" も
testpaths = ["tests"]     # テスト関数が減っていないかを、この中で数える

[tool.ruff.lint]
select = ["F", "E9", "B"]  # 少なめから始めて、違反を直しながら増やす

[tool.coverage.run]
branch = true
source_pkgs = ["<パッケージ名>"]  # 測るのは自分のコードだけ（テストや依存を含めると数字が水増しされる）

[tool.coverage.report]
fail_under = 0  # 導入時に測った値の小数を切り捨てて入れる。上がったら引き上げる。下げない
show_missing = true
skip_covered = true

# 方針の文書を docs/quality-gates.md 以外に置くときだけ書く
# [tool.quality-gate]
# doc = "docs/quality-gates.md"
